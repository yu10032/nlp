<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课程问题 · 独立复核</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f1e8;
        --sheet: #fffdf8;
        --ink: #1f1c17;
        --muted: #6e675b;
        --rule: #d9d0bf;
        --blue: #284a7e;
        --red: #b4412c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.7 "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      input,
      select,
      textarea,
      summary {
        outline-offset: 4px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--blue);
      }
      button {
        cursor: pointer;
        padding: 9px 16px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: var(--sheet);
      }
      button:disabled {
        cursor: default;
        color: var(--muted);
        border-style: dashed;
      }
      button.primary {
        background: var(--ink);
        color: var(--sheet);
        border-color: var(--ink);
      }
      button.primary:disabled {
        background: transparent;
        color: var(--muted);
        border-color: var(--rule);
      }
      header {
        border-bottom: 1px solid var(--rule);
        padding: 22px max(24px, calc((100vw - 1280px) / 2));
        background: var(--sheet);
      }
      header .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      h1,
      h2,
      h3,
      .question {
        font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
      }
      h1 {
        font-size: 29px;
        margin: 3px 0 12px;
        font-weight: 600;
      }
      h2 {
        font-size: 19px;
        margin: 0 0 18px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 6px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 14px;
      }
      .toolbar label {
        display: grid;
        gap: 4px;
        font-size: 13px;
      }
      .toolbar input {
        width: 180px;
      }
      .toolbar .progress {
        margin-left: auto;
        color: var(--muted);
        font-size: 14px;
      }
      input:not([type="checkbox"]),
      textarea,
      select {
        padding: 8px 10px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: var(--sheet);
        max-width: 100%;
      }
      input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--ink);
        flex-shrink: 0;
      }
      main {
        max-width: 1280px;
        margin: 26px auto 60px;
        padding: 0 24px;
      }
      .notice {
        color: var(--muted);
        margin: 0 0 22px;
        font-size: 14px;
      }
      .layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr) 330px;
        gap: 26px;
        align-items: start;
      }
      aside,
      .work {
        min-width: 0;
      }
      .navigator input {
        width: 100%;
        margin-bottom: 10px;
      }
      .navigator select {
        width: 100%;
      }
      .question-list {
        max-height: 65vh;
        overflow: auto;
        margin-top: 16px;
        border-top: 1px solid var(--rule);
      }
      .question-list button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--rule);
        padding: 12px 8px;
        background: none;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .question-list button[aria-current="true"] {
        border-left: 2px solid var(--ink);
        background: var(--sheet);
      }
      .question-list small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .work {
        padding: 28px;
        background: var(--sheet);
      }
      .document-head {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        color: var(--muted);
        font-size: 13px;
      }
      .question {
        font-size: 24px;
        line-height: 1.7;
        margin: 20px 0 26px;
        overflow-wrap: anywhere;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 22px 0;
      }
      .field textarea {
        width: 100%;
        resize: vertical;
        min-height: 96px;
      }
      .nodes {
        border: 0;
        border-top: 1px solid var(--rule);
        padding: 20px 0 0;
        margin: 24px 0;
      }
      .nodes legend {
        font-weight: 600;
        padding: 0 10px 0 0;
      }
      .node-choice {
        display: flex;
        gap: 10px;
        align-items: start;
        padding: 10px 0;
        line-height: 1.6;
      }
      .node-choice span {
        min-width: 0;
      }
      .node-choice small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .no-match {
        border-top: 1px solid var(--rule);
        margin-top: 10px;
        padding-top: 16px;
      }
      .confirmation {
        border-top: 1px solid var(--rule);
        padding-top: 20px;
      }
      .confirm-row {
        display: flex;
        align-items: start;
        gap: 9px;
        margin-bottom: 15px;
      }
      .pager {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        margin-top: 20px;
      }
      .evidence {
        border-top: 2px solid var(--ink);
        padding-top: 18px;
      }
      .evidence details {
        padding: 12px 0;
        border-bottom: 1px solid var(--rule);
      }
      summary {
        cursor: pointer;
      }
      summary small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .evidence details p {
        font:
          15px/1.85 "Songti SC",
          SimSun,
          serif;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .locator {
        font-size: 12px;
        color: var(--muted);
      }
      .status {
        min-height: 24px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .status.error {
        color: #85500f;
        font-weight: 600;
      }
      .review-state {
        color: var(--red);
      }
      .peers {
        display: grid;
        gap: 15px;
        border-left: 2px solid var(--rule);
        padding-left: 15px;
        margin: 20px 0;
        font-size: 14px;
      }
      .peers p {
        margin: 5px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 24px 0;
        color: var(--muted);
      }
      a {
        color: var(--blue);
      }
      .import {
        position: relative;
        cursor: pointer;
        border-bottom: 1px solid var(--blue);
        color: var(--blue);
        font-size: 14px;
      }
      .import input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        cursor: pointer;
      }
      .family-note {
        font-size: 13px;
        color: var(--muted);
      }
      .siblings {
        font-size: 14px;
      }
      .siblings p {
        margin: 8px 0;
        font-family: "Songti SC", SimSun, serif;
      }
      .rule {
        font-size: 14px;
        color: var(--muted);
      }
      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 180px minmax(0, 1fr);
        }
        .evidence {
          grid-column: 1/-1;
        }
        .toolbar .progress {
          margin-left: 0;
        }
      }
      @media (max-width: 640px) {
        header {
          padding: 18px;
        }
        main {
          padding: 0 14px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
        .question-list {
          max-height: 180px;
        }
        .work {
          padding: 22px 18px;
        }
        .question {
          font-size: 21px;
        }
        .toolbar {
          gap: 12px;
        }
        .toolbar .progress {
          width: 100%;
        }
        .pager button {
          min-height: 44px;
        }
        .evidence {
          grid-column: auto;
        }
        .question-list button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">课程问题 / 人工复核</p>
      <h1 id="heading">独立复核</h1>
      <div class="toolbar">
        <label
          >复核人<input
            id="reviewer"
            autocomplete="name"
            maxlength="80"
            placeholder="填写实际复核人"
        /></label>
        <button id="export" class="primary">导出复核记录</button>
        <label class="import"
          >恢复已导出记录<input
            id="import"
            type="file"
            accept=".jsonl,.txt"
            aria-label="恢复已导出记录"
        /></label>
        <span id="progress" class="progress" aria-live="polite"></span>
      </div>
      <p id="status" class="status" role="status"></p>
    </header>
    <main>
      <p id="context" class="notice"></p>
      <div class="layout">
        <aside class="navigator" aria-label="问题目录">
          <label for="search">查找问题</label
          ><input id="search" placeholder="编号或关键词" />
          <label for="filter">查看范围</label
          ><select id="filter">
            <option value="all">全部问题</option>
            <option value="pending">尚未确认</option>
            <option value="confirmed">已确认</option>
          </select>
          <nav id="list" class="question-list" aria-label="选择问题"></nav>
        </aside>
        <article id="work" class="work" aria-label="当前问题复核"></article>
        <aside class="evidence" aria-label="课程知识点与原文">
          <h2>判定依据</h2>
          <p class="rule">
            只标回答问题必需的知识点。允许多选；不涉及当前图谱时，明确选择“无关联”。
          </p>
          <div id="evidence"></div>
        </aside>
      </div>
    </main>
    <script id="payload" type="application/json">
      __REVIEW_PAYLOAD__
    </script>
    <script>
      "use strict";
      const packet = JSON.parse(document.getElementById("payload").textContent);
      const $ = (id) => document.getElementById(id);
      const storageKey =
        "course-review:" + packet.packet_id + ":" + packet.slot;
      let current = 0,
        reviewer = "",
        records = {};
      const blank = (q) => ({
        packet_id: packet.packet_id,
        slot: packet.slot,
        id: q.id,
        question: q.question,
        family_id: q.family_id,
        node_ids: [],
        no_match: false,
        reviewer: "",
        rationale: "",
        decision: "pending",
      });
      for (const q of packet.questions) records[q.id] = blank(q);
      function message(text, error = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", error);
      }
      function element(tag, text, cls) {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      }
      function validateImport(rows) {
        if (rows.length !== packet.questions.length)
          throw Error("问题数量不符，请选择本角色的完整导出记录。");
        const found = new Map();
        const nodeIds = new Set(packet.nodes.map((n) => n.id));
        for (const r of rows) {
          const q = packet.questions.find((q) => q.id === r.id);
          if (
            !q ||
            found.has(r.id) ||
            r.question !== q.question ||
            r.packet_id !== packet.packet_id ||
            r.slot !== packet.slot
          )
            throw Error("复核包、角色、问题正文或编号不符。");
          if (
            !Array.isArray(r.node_ids) ||
            r.node_ids.some((n) => !nodeIds.has(n)) ||
            new Set(r.node_ids).size !== r.node_ids.length ||
            typeof r.no_match !== "boolean" ||
            typeof r.family_id !== "string" ||
            typeof r.rationale !== "string" ||
            typeof r.reviewer !== "string" ||
            !["pending", "confirmed"].includes(r.decision)
          )
            throw Error("记录格式无效。");
          if (r.no_match && r.node_ids.length)
            throw Error("无关联与知识点选择冲突。");
          if (
            r.decision === "confirmed" &&
            (!r.reviewer.trim() ||
              !r.rationale.trim() ||
              !r.family_id.trim() ||
              (!r.no_match && !r.node_ids.length))
          )
            throw Error("已确认记录缺少必要信息。");
          found.set(r.id, r);
        }
        if (new Set(rows.map((r) => r.reviewer.trim())).size > 1)
          throw Error("同一份记录应由同一人复核。");
        return Object.fromEntries(found);
      }
      function store() {
        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify(Object.values(records)),
          );
          message("已暂存到此浏览器；请及时导出文件备份。");
        } catch (error) {
          message("浏览器暂存不可用，请导出记录保存。", true);
        }
      }
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) {
          records = validateImport(JSON.parse(saved));
          reviewer = Object.values(records)[0]?.reviewer || "";
          message("已恢复此浏览器的复核进度。");
        }
      } catch (error) {
        message("暂存记录无法读取，请从导出文件恢复：" + error.message, true);
      }
      $("reviewer").value = reviewer;
      $("heading").textContent =
        packet.slot === "adjudication"
          ? "分歧裁决"
          : "独立复核 · " + packet.slot.toUpperCase();
      $("context").textContent =
        packet.dataset_version +
        " · " +
        packet.course_id +
        " · 图谱 v" +
        packet.graph_version +
        (packet.origin === "development" ? " · 开发候选（非课堂实录）" : " · 课堂来源待核查") +
        "。" +
        (packet.slot === "adjudication"
          ? "请比较两人的判断，独立确定最终标签与问题家族。"
          : "页面未提供原开发标签或模型建议，请分别完成后交给负责人汇总。");
      for (const n of packet.nodes) {
        const details = element("details"),
          summary = element("summary", n.name);
        summary.append(element("small", n.id));
        details.append(summary, element("p", n.description));
        for (const source of n.evidence || []) {
          details.append(
            element(
              "div",
              source.title + " · v" + source.version + " · " + source.locator,
              "locator",
            ),
            element("p", source.text),
          );
        }
        $("evidence").append(details);
      }
      function visibleQuestions() {
        const search = $("search").value.trim().toLowerCase(),
          filter = $("filter").value;
        return packet.questions.filter(
          (q) =>
            (!search ||
              (q.id + " " + q.question).toLowerCase().includes(search)) &&
            (filter === "all" || records[q.id].decision === filter),
        );
      }
      function renderList() {
        $("list").replaceChildren();
        for (const q of visibleQuestions()) {
          const button = element("button", q.question);
          button.type = "button";
          button.setAttribute(
            "aria-current",
            String(packet.questions[current]?.id === q.id),
          );
          button.append(
            element(
              "small",
              q.id +
                " · " +
                (records[q.id].decision === "confirmed" ? "已确认" : "待确认"),
            ),
          );
          button.onclick = () => {
            current = packet.questions.indexOf(q);
            render();
          };
          $("list").append(button);
        }
        if (!$("list").children.length)
          $("list").append(element("p", "没有符合条件的问题。", "empty"));
        $("progress").textContent =
          Object.values(records).filter((r) => r.decision === "confirmed")
            .length +
          " / " +
          packet.questions.length +
          " 已确认";
      }
      function render() {
        renderList();
        const q = packet.questions[current],
          r = records[q.id],
          work = $("work");
        work.replaceChildren();
        const head = element("div", undefined, "document-head");
        head.append(
          element(
            "span",
            q.id + " · " + (current + 1) + " / " + packet.questions.length,
          ),
          element(
            "span",
            r.decision === "confirmed" ? "已确认" : "待确认",
            "review-state",
          ),
        );
        work.append(head, element("p", q.question, "question"));
        if (packet.peers[q.id]) {
          const peers = element("div", undefined, "peers");
          for (const [slot, review] of Object.entries(packet.peers[q.id])) {
            const part = element("section");
            part.append(
              element("h3", slot.toUpperCase() + " · " + review.reviewer),
              element(
                "p",
                "标签：" +
                  (review.node_ids
                    .map((id) => packet.nodes.find((n) => n.id === id).name)
                    .join("、") || "无关联"),
              ),
              element("p", "家族：" + review.family_id),
              element("p", "理由：" + review.rationale),
            );
            peers.append(part);
          }
          work.append(peers);
        }
        function changed() {
          r.decision = "pending";
          r.reviewer = reviewer;
          store();
          renderList();
          head.lastChild.textContent = "待确认";
          confirm.checked = false;
          updateConfirm();
        }
        const familyLabel = element("label", "问题家族", "field"),
          family = element("input");
        family.value = r.family_id;
        family.maxLength = 120;
        family.setAttribute("aria-label", "问题家族");
        family.oninput = () => {
          r.family_id = family.value;
          changed();
        };
        familyLabel.append(family);
        work.append(
          familyLabel,
          element(
            "p",
            "同一原问题及改写必须使用同一个家族编号。原编号是待复核候选，拆分或合并时请统一命名。",
            "family-note",
          ),
        );
        const siblings = element("details", undefined, "siblings");
        siblings.append(element("summary", "查看原候选家族中的问题"));
        for (const sibling of packet.family_questions.filter(
          (x) => x.family_id === q.family_id,
        ))
          siblings.append(element("p", sibling.id + " · " + sibling.question));
        work.append(siblings);
        const fieldset = element("fieldset", undefined, "nodes");
        fieldset.append(element("legend", "关联知识点"));
        for (const node of packet.nodes) {
          const label = element("label", undefined, "node-choice"),
            box = element("input"),
            span = element("span", node.name);
          box.type = "checkbox";
          box.checked = r.node_ids.includes(node.id);
          box.setAttribute("aria-label", "关联" + node.name);
          span.append(element("small", node.id));
          box.onchange = () => {
            r.node_ids = box.checked
              ? [...r.node_ids, node.id]
              : r.node_ids.filter((id) => id !== node.id);
            r.no_match = false;
            noMatch.checked = false;
            changed();
          };
          label.append(box, span);
          fieldset.append(label);
        }
        const noLabel = element("label", undefined, "node-choice no-match"),
          noMatch = element("input");
        noMatch.type = "checkbox";
        noMatch.checked = r.no_match;
        noMatch.setAttribute("aria-label", "无关联");
        noMatch.onchange = () => {
          r.no_match = noMatch.checked;
          if (r.no_match) {
            r.node_ids = [];
            for (const box of fieldset.querySelectorAll("input"))
              box.checked = false;
            noMatch.checked = true;
          }
          changed();
        };
        noLabel.append(
          noMatch,
          element("span", "无关联 · 当前知识点不能回答此问题"),
        );
        fieldset.append(noLabel);
        work.append(fieldset);
        const reasonLabel = element("label", "判定理由与家族调整说明", "field"),
          reason = element("textarea");
        reason.value = r.rationale;
        reason.rows = 4;
        reason.maxLength = 4000;
        reason.setAttribute("aria-label", "判定理由与家族调整说明");
        reason.oninput = () => {
          r.rationale = reason.value;
          changed();
        };
        reasonLabel.append(reason);
        work.append(reasonLabel);
        const confirmation = element("div", undefined, "confirmation"),
          label = element("label", undefined, "confirm-row"),
          confirm = element("input");
        confirm.type = "checkbox";
        confirm.checked = r.decision === "confirmed";
        confirm.setAttribute("aria-label", "已核查问题、知识点和同源家族");
        label.append(confirm, element("span", "已核查问题、知识点和同源家族"));
        const save = element("button", "确认本题", "primary");
        save.type = "button";
        function updateConfirm() {
          save.disabled =
            !reviewer.trim() ||
            !r.family_id.trim() ||
            !r.rationale.trim() ||
            (!r.node_ids.length && !r.no_match) ||
            !confirm.checked;
        }
        confirm.onchange = () => {
          if (!confirm.checked) {
            r.decision = "pending";
            r.reviewer = reviewer;
            store();
            renderList();
            head.lastChild.textContent = "待确认";
          }
          updateConfirm();
        };
        save.onclick = () => {
          r.decision = "confirmed";
          r.reviewer = reviewer.trim();
          store();
          render();
        };
        confirmation.append(label, save);
        work.append(confirmation);
        updateConfirm();
        const pager = element("div", undefined, "pager");
        for (const [text, delta] of [
          ["上一题", -1],
          ["下一题", 1],
        ]) {
          const button = element("button", text);
          button.disabled =
            current + delta < 0 || current + delta >= packet.questions.length;
          button.onclick = () => {
            current += delta;
            render();
          };
          pager.append(button);
        }
        work.append(pager);
      }
      $("reviewer").oninput = () => {
        reviewer = $("reviewer").value;
        for (const r of Object.values(records)) {
          r.decision = "pending";
          r.reviewer = reviewer;
        }
        store();
        render();
      };
      $("search").oninput = renderList;
      $("filter").onchange = renderList;
      $("export").onclick = () => {
        const content =
          packet.questions
            .map((q) =>
              JSON.stringify({ ...records[q.id], reviewer: reviewer.trim() }),
            )
            .join("\n") + "\n";
        const blob = new Blob([content], {
            type: "application/x-ndjson;charset=utf-8",
          }),
          url = URL.createObjectURL(blob),
          link = element("a");
        link.href = url;
        link.download = packet.packet_id + "-" + packet.slot + ".jsonl";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        message("已导出复核记录。尚未确认的条目会保留为待确认，不能进入汇总。");
      };
      $("import").onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const rows = (await file.text())
            .split(/\r?\n/)
            .filter((line) => line.trim())
            .map((line) => JSON.parse(line));
          const restored = validateImport(rows);
          records = restored;
          reviewer = rows[0]?.reviewer || "";
          $("reviewer").value = reviewer;
          store();
          render();
          message("已恢复导出记录。");
        } catch (error) {
          message("恢复失败：" + error.message, true);
        } finally {
          event.target.value = "";
        }
      };
      render();
    </script>
  </body>
</html>
