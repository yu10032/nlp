[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-matcher"
version = "0.1.0"
description = "冻结句编码器与可训练 MLP 匹配头"
requires-python = ">=3.12"
dependencies = ["torch>=2.5,<3", "sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]
