[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-ta-backend"
version = "0.1.0"
description = "课程智能助教系统业务后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "sqlalchemy>=2.0.49,<2.1",
  "alembic>=1.17,<2",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "latex2mathml>=3.81,<4",
  "mathml2omml==0.0.2",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]
